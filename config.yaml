# Every threshold and weight lives here. The hash of this file is recorded in
# run_log.config_hash, so any change produces a distinguishable run.

paths:
  db: store/engine.duckdb
  snapshots: snapshots
  cache: cache/raw

# Hours before a cached raw API response is refetched.
cache_ttl_hours:
  yahooquery: 24
  yfinance: 24
  edgar: 24   # a new 10-Q/10-K is picked up within a day

sources:
  # Highest priority first (schema §1).
  priority: [edgar, yahooquery, yfinance]
  # Same field/period differing by more than this across sources is logged.
  conflict_tolerance: 0.05

sec:
  # Required by the SEC fair-access policy: "Your Name your@email.com".
  # EDGAR ingestion is skipped while this is empty.
  user_agent: ""
  # Seconds between requests (SEC allows at most 10 per second).
  request_interval: 0.15

ingest:
  batch_size: 50                 # symbols per yahooquery request
  # Pacing, so thousands of symbols don't trip Yahoo's rate limits or time out.
  batch_delay_seconds: 2.0       # pause between yahooquery batches
  request_timeout_seconds: 30    # per HTTP request (yahooquery default is 5)
  max_workers: 4                 # concurrent requests within a batch
  max_retries: 3                 # per batch / request, after the first try
  retry_backoff_seconds: 15      # doubles on each retry: 15, 30, 60
  yfinance_delay_seconds: 0.5    # between yfinance calls (fallback only)
  price_history: 5y              # yahooquery history period
  use_yfinance_fallback: true
  # With --universe, only securities passing the market-data knockouts (price,
  # size, liquidity, sector, equity type) get statements, history and EDGAR.
  prefilter: true

listings:
  exclude_adrs: true             # thesis is North American companies

# Days after period_end before a Yahoo-sourced figure is treated as known
# (schema §5). EDGAR rows use the actual filing date instead.
availability_lag_days:
  US:   {Q: 45, FY: 90}
  TSX:  {Q: 45, FY: 90}
  TSXV: {Q: 60, FY: 120}

fx:
  # "yahooquery" pulls daily rates (e.g. USDCAD=X); "static" uses the table below.
  provider: yahooquery
  # Used when provider is "static", or as a last resort when a live rate is missing.
  # Keys are FROM+TO, value is units of TO per one FROM.
  static_rates:
    USDCAD: 1.37
  allow_static_fallback: false

validation:
  # Drop when the latest FY is older than this (by listing region; TSX-V
  # annual statements are due 120 days after year-end, US/TSX 90).
  staleness_months: {US: 15, TSX: 15, TSXV: 16}
  balance_identity_tolerance: 0.02
  share_jump_threshold: 0.50
  # Completeness knockout: at least `min_required_fields` of these must be
  # present in the latest FY.
  required_fields:
    - revenue
    - operating_income
    - net_income
    - total_assets
    - total_liabilities
    - total_equity
    - cash
    - operating_cash_flow
    - capex
    - shares_outstanding
  min_required_fields: 8
  # Ratio bounds used by the outlier check (applied once factors exist, v1.1).
  outlier_bounds:
    roic: [-2.0, 2.0]
    operating_margin: [-2.0, 1.0]
    ev_ebit: [-500, 500]

debt:
  # Open decision (schema §8): include IFRS 16 / ASC 842 lease liabilities.
  include_leases: false

tax:
  clip: [0.0, 0.40]
  # Statutory fallback when pretax income <= 0 or missing (schema §4).
  statutory_rates:
    US: 0.21
    CA: 0.265
    default: 0.25

# ---- Stage settings below are consumed from v1.1 onward ----

universe:
  # Size and liquidity are compared in this currency (market data is converted
  # at the latest FX rate), so a CAD and a USD listing face the same bar.
  currency: USD
  min_price: 1.0              # trading currency
  min_market_cap: 100_000_000
  # Average daily traded value (3-month avg volume × price), not share count:
  # 50k shares of a $0.40 explorer and of a $400 stock are not comparable.
  min_avg_dollar_volume: 250_000
  # Last quote older than this (days before the run) = halted or delisted.
  max_quote_age_days: 7
  # D-010: excluded until sector models exist.
  excluded_sectors: [Financial Services, Real Estate]
  # Company country per Yahoo (headquarters). The thesis is North American
  # companies; US listings of foreign companies are knocked out. [] = any.
  countries: [United States, Canada]

screen:
  # Refuse to score a data run older than this (prices and estimates move);
  # re-run the data stage, or pass --allow-stale to score it anyway.
  max_run_age_days: 3

peers:
  # D-002 / D-018: peers share industry AND segment (producing, pre_revenue,
  # royalty). A factor is ranked within industry+segment, else sector+segment
  # (each needs min_peer_count values), else the whole segment across
  # industries (min_segment_peers), else the universe. The peer group used is
  # stored with every score.
  min_peer_count: 5
  min_segment_peers: 3
  # Below this revenue (universe.currency, base period) a company is
  # pre-revenue: explorers and developers are ranked against each other.
  pre_revenue_max: 10_000_000

factors:
  # D-013: a missing debt, minority-interest or cash line is 0 when the balance
  # sheet was reported (total_assets present). Otherwise debt-free or cash-free
  # companies get no EV or ROIC.
  missing_balance_is_zero: true
  # Interest expense below this share of revenue is immaterial: coverage is
  # ranked at the top instead of computed (schema §4).
  immaterial_interest_pct_revenue: 0.001
  # Window for insider buying.
  insider_window_days: 182
  # D-017: royalty and streaming companies. Their capex is mostly buying new
  # streams (an acquisition), so free cash flow = operating cash flow. Yahoo
  # labels them by metal ("Gold"), hence a list. Use security IDs: bare tickers
  # collide across exchanges (OGN is Orogen on TSX-V but Organon on NYSE).
  royalty_companies: [XTSE:FNV, XNYS:FNV, XTSE:WPM, XNYS:WPM, XTSE:OR, XNYS:OR,
                      XNAS:RGLD, XTSE:TFPM, XNYS:TFPM, XTSX:OGN, XTSX:MTA, XASE:MTA,
                      XTSX:EMX, XASE:EMX, XTSE:ALS, XNAS:VOXR, XTSE:VOXR, XTSX:MMX]

scoring:
  # Composite = weighted mean of category scores; a category score is the mean
  # of its available factor percentiles. Weights are renormalized over the
  # categories a security has, but it needs at least `min_categories`.
  category_weights:
    quality: 0.30
    value: 0.30
    expectations: 0.15
    price: 0.10
    risk: 0.15
  min_categories: 3
  # A category counts only when at least this share of its factors is
  # available (an explorer's "value" would otherwise be FCF yield alone,
  # which measures cash burn, not cheapness).
  min_factor_share: 0.5
  # factor: [category, direction]. direction "high" = higher raw value scores
  # higher. Factors with category "none" are computed and stored, not scored.
  factors:
    roic:                 [quality, high]
    operating_margin:     [quality, high]
    margin_stability:     [quality, low]
    fcf_conversion:       [quality, high]
    revenue_growth_3y:    [quality, high]
    ev_ebit:              [value, low]
    ev_ebitda:            [value, low]
    ev_sales:             [value, low]
    fcf_yield:            [value, high]
    eps_revision_90d:     [expectations, high]
    insider_net_buy_pct:  [expectations, high]
    drawdown_52w:         [price, low]     # deeper drawdown = more pessimism priced in
    momentum_12_1:        [none, high]     # D-003: timing only, used by monitor/
    altman_z2:            [risk, high]
    interest_coverage:    [risk, high]
    net_debt_ebitda:      [risk, low]
    cash_runway_years:    [risk, high]
    dilution_1y:          [risk, low]
